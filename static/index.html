<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OLLM Tutor</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInPage()"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', suppressErrorRendering: true });
    window.__mermaid = mermaid;
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #1a1a2e;
    }

    header {
      background: #1a1a2e;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.03em; }

    .mode-toggle {
      display: flex;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    .mode-toggle button {
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.6);
      padding: 6px 18px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.15s;
    }

    .mode-toggle button.active { background: #4f46e5; color: white; }

    .settings-bar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 8px 24px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
    }

    .settings-bar label { font-size: 0.75rem; color: #6b7280; font-weight: 500; }

    .settings-bar input {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      color: #374151;
      outline: none;
      transition: border-color 0.15s;
    }

    .settings-bar input:focus { border-color: #4f46e5; }
    #input-model   { width: 200px; }
    #input-host    { width: 210px; }
    #input-api-key { width: 260px; font-family: monospace; letter-spacing: 0.03em; }

    .provider-toggle {
      display: flex;
      background: #f3f4f6;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    .provider-toggle button {
      border: none; background: transparent;
      color: #6b7280; padding: 4px 14px;
      cursor: pointer; font-size: 0.78rem; font-weight: 500;
      transition: all 0.15s;
    }

    .provider-toggle button.active { background: #4f46e5; color: white; }

    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bubble-row { display: flex; gap: 10px; align-items: flex-end; }
    .bubble-row.tutor   { justify-content: flex-start; }
    .bubble-row.student { justify-content: flex-end; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700;
      flex-shrink: 0;
    }

    .avatar.tutor-av   { background: #4f46e5; color: white; }
    .avatar.student-av { background: #10b981; color: white; }

    .bubble {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.92rem;
    }

    .tutor .bubble {
      background: white;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .student .bubble {
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 4px;
    }

    /* Check mode's verdict. Only ever drawn when the model actually signalled:
       a null verdict means strip_signal found no marker, which is "do not know"
       and must not look like a cross. Those replies get an ordinary bubble. */
    .tutor .bubble.verdict-correct { border-left: 3px solid #16a34a; }
    .tutor .bubble.verdict-wrong   { border-left: 3px solid #dc2626; }

    .verdict {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    .verdict.verdict-correct { color: #16a34a; }
    .verdict.verdict-wrong   { color: #dc2626; }

    .bubble p { margin-bottom: 0.5em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble strong { font-weight: 600; }
    .bubble ul, .bubble ol { padding-left: 1.2em; margin: 0.4em 0; }
    .bubble li { margin-bottom: 0.25em; }
    .bubble code {
      background: #f3f4f6; padding: 1px 5px;
      border-radius: 4px; font-size: 0.85em; font-family: monospace;
    }
    .student .bubble code { background: rgba(255,255,255,0.15); }

    /* attachment preview inside bubble */
    .bubble .attach-preview {
      margin-top: 8px;
      border-radius: 8px;
      overflow: hidden;
      max-width: 200px;
    }
    .bubble .attach-preview img { width: 100%; display: block; }
    .bubble .attach-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,0.08);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 0.8rem;
      margin-top: 6px;
    }
    .student .bubble .attach-pill { background: rgba(255,255,255,0.2); }

    .done-banner {
      text-align: center; padding: 10px 20px;
      background: #d1fae5; color: #065f46;
      border-radius: 10px; font-weight: 600; font-size: 0.9rem;
      margin: 8px auto; width: fit-content;
    }

    .thinking {
      display: flex; gap: 5px; align-items: center; padding: 12px 16px;
    }
    .thinking span {
      width: 7px; height: 7px;
      background: #9ca3af; border-radius: 50%;
      animation: bounce 1s infinite;
    }
    .thinking span:nth-child(2) { animation-delay: 0.15s; }
    .thinking span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* ---- panels ---- */
    #learn-panel, #check-panel {
      background: white;
      border-top: 1px solid #e5e7eb;
      padding: 12px 24px 16px;
      display: flex; flex-direction: column; gap: 10px;
      flex-shrink: 0;
    }

    /* attachment preview strip */
    .attach-strip {
      display: flex; align-items: center; gap: 10px;
      background: #f3f4f6; border-radius: 10px;
      padding: 8px 12px; font-size: 0.82rem; color: #374151;
    }
    .attach-strip img { height: 48px; border-radius: 6px; }
    .attach-strip .attach-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attach-strip button {
      background: none; border: none; cursor: pointer;
      color: #9ca3af; font-size: 1rem; line-height: 1;
      padding: 2px 4px;
    }
    .attach-strip button:hover { color: #ef4444; }

    .input-row { display: flex; gap: 10px; align-items: flex-end; }

    .input-row input, .input-row textarea {
      flex: 1;
      border: 1px solid #d1d5db; border-radius: 10px;
      padding: 10px 14px; font-size: 0.9rem; font-family: inherit;
      outline: none; resize: none; transition: border-color 0.15s;
    }
    .input-row input:focus, .input-row textarea:focus { border-color: #4f46e5; }
    #input-answer { min-height: 44px; max-height: 120px; }
    #input-question, #input-check-answer { height: 60px; }

    .icon-btn {
      background: none; border: 1px solid #d1d5db; border-radius: 10px;
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #6b7280; transition: all 0.15s; flex-shrink: 0;
    }
    .icon-btn:hover { border-color: #4f46e5; color: #4f46e5; }

    /* mermaid diagrams inside bubbles */
    .bubble .mermaid-wrap { margin-top: 10px; background: #f8fafc; border-radius: 10px; padding: 12px; overflow-x: auto; }
    .bubble .mermaid-wrap svg { max-width: 100%; }

    /* generated graph images */
    .bubble .graph-img { margin-top: 10px; border-radius: 10px; overflow: hidden; max-width: 100%; }
    .bubble .graph-img img { width: 100%; display: block; }

    /* multiple-choice option buttons */
    .options-row {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 4px 0 4px 42px;
      margin-top: -8px;
    }
    .option-btn {
      background: white; border: 2px solid #4f46e5;
      border-radius: 10px; padding: 7px 16px;
      cursor: pointer; font-size: 0.88rem;
      color: #4f46e5; font-weight: 500;
      transition: all 0.15s;
    }
    .option-btn:hover:not(:disabled) { background: #4f46e5; color: white; }
    .option-btn:disabled { opacity: 0.45; cursor: not-allowed; border-color: #9ca3af; color: #9ca3af; }
    .option-btn.correct { background: #d1fae5; border-color: #059669; color: #065f46; }
    .option-btn.wrong   { background: #fee2e2; border-color: #dc2626; color: #7f1d1d; }

    /* past-paper sources */
    .sources-bar {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 6px 0 2px 42px;
    }
    .source-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: #eff6ff; border: 1px solid #bfdbfe;
      border-radius: 20px; padding: 3px 10px;
      font-size: 0.75rem; color: #1d4ed8;
      text-decoration: none; max-width: 260px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .source-chip:hover { background: #dbeafe; }

    /* downloadable past papers — greener and heavier than a plain source link,
       since this is a real file rather than a page to read */
    .paper-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: #ecfdf5; border: 1px solid #6ee7b7;
      border-radius: 20px; padding: 4px 11px;
      font-size: 0.78rem; color: #065f46; font-weight: 500;
      text-decoration: none; max-width: 300px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .paper-chip:hover { background: #d1fae5; }
    .paper-chip.scanned { background: #fffbeb; border-color: #fcd34d; color: #92400e; }
    .grounding-note {
      padding: 2px 0 4px 42px; font-size: 0.72rem; color: #6b7280;
    }

    /* paper progress pill */
    .paper-progress {
      text-align: center; font-size: 0.8rem; color: #6b7280;
      padding: 2px 0 6px 0;
    }

    button.send-btn {
      background: #4f46e5; color: white; border: none;
      border-radius: 10px; padding: 0 20px; height: 44px;
      cursor: pointer; font-size: 0.9rem; font-weight: 600;
      transition: background 0.15s; white-space: nowrap; flex-shrink: 0;
    }
    button.send-btn:hover    { background: #4338ca; }
    button.send-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    /* ---- session history sidebar ---- */
    /* min-height:0 on the flex parents is what keeps #chat-area scrollable —
       without it a flex child refuses to shrink below its content height. */
    #body-row { flex: 1; display: flex; min-height: 0; }

    #sidebar {
      width: 260px; flex-shrink: 0;
      background: #16162b; color: #cbd5e1;
      display: flex; flex-direction: column;
      border-right: 1px solid #0f0f1f;
    }

    #sidebar-head { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }

    #btn-new-lesson {
      width: 100%; border: 1px solid rgba(255,255,255,0.15);
      background: transparent; color: #e2e8f0;
      border-radius: 8px; padding: 8px; cursor: pointer;
      font-size: 0.82rem; font-weight: 500; transition: background 0.15s;
    }
    #btn-new-lesson:hover { background: rgba(255,255,255,0.08); }

    #session-list { flex: 1; overflow-y: auto; padding: 8px; }

    .session-item {
      padding: 8px 10px; border-radius: 8px; cursor: pointer;
      margin-bottom: 2px; transition: background 0.12s;
    }
    .session-item:hover  { background: rgba(255,255,255,0.07); }
    .session-item.active { background: #4f46e5; color: white; }

    .session-title {
      font-size: 0.82rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .session-meta  { font-size: 0.68rem; opacity: 0.55; margin-top: 2px; }
    .session-empty { font-size: 0.75rem; opacity: 0.5; padding: 10px; }

    /* min-width:0 lets a long bubble shrink instead of pushing the sidebar off */
    #main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

    #btn-sidebar, #btn-logout {
      border: none; background: rgba(255,255,255,0.1); color: white;
      border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 0.9rem;
    }

    .history-banner {
      background: #fef3c7; color: #92400e;
      border: 1px solid #fde68a; border-radius: 8px;
      padding: 8px 12px; font-size: 0.78rem; text-align: center;
    }

    .hidden { display: none !important; }

    /* login gate — sits over everything until /api/me returns a user */
    #auth-gate {
      position: fixed; inset: 0; z-index: 100;
      background: #0f172a; display: flex;
      align-items: center; justify-content: center;
    }
    #auth-card {
      background: white; border-radius: 12px; padding: 28px;
      width: 320px; max-width: calc(100vw - 32px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    #auth-card h2 { margin: 0 0 4px; font-size: 1.15rem; }
    #auth-sub { margin: 0 0 18px; font-size: 0.8rem; color: #64748b; }
    #auth-card input {
      width: 100%; box-sizing: border-box; margin-bottom: 10px;
      padding: 9px 11px; border: 1px solid #cbd5e1;
      border-radius: 7px; font-size: 0.9rem;
    }
    #auth-submit {
      width: 100%; padding: 10px; border: none; border-radius: 7px;
      background: #2563eb; color: white; font-size: 0.9rem; cursor: pointer;
    }
    #auth-submit:disabled { opacity: 0.6; cursor: default; }
    #auth-switch {
      margin: 14px 0 0; font-size: 0.78rem; color: #64748b; text-align: center;
    }
    #auth-switch a { color: #2563eb; cursor: pointer; text-decoration: underline; }
    #auth-error {
      margin: 0 0 10px; font-size: 0.78rem; color: #b91c1c;
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 6px; padding: 7px 9px;
    }
    #whoami { font-size: 0.78rem; color: rgba(255,255,255,0.75); margin-right: 4px; }
  </style>
</head>
<body>

<div id="auth-gate">
  <div id="auth-card">
    <h2 id="auth-title">Log in</h2>
    <p id="auth-sub">Your lessons are private to your account.</p>
    <p id="auth-error" class="hidden"></p>
    <form id="auth-form" onsubmit="submitAuth(event)">
      <input id="auth-username" type="text" placeholder="Username"
             autocomplete="username" required>
      <input id="auth-password" type="password" placeholder="Password"
             autocomplete="current-password" required>
      <button id="auth-submit" type="submit">Log in</button>
    </form>
    <p id="auth-switch">
      <span id="auth-switch-text">No account yet?</span>
      <a onclick="toggleAuthMode()" id="auth-switch-link">Create one</a>
    </p>
  </div>
</div>

<header>
  <h1>OLLM Tutor</h1>
  <div class="mode-toggle">
    <button id="btn-learn" class="active" onclick="setMode('learn')">Learn</button>
    <button id="btn-check" onclick="setMode('check')">Check</button>
  </div>
  <span id="whoami"></span>
  <button id="btn-logout" onclick="logout()" title="Log out">Log out</button>
  <button id="btn-sidebar" onclick="toggleSidebar()" title="Show or hide past lessons">☰</button>
</header>

<div id="body-row">

<aside id="sidebar">
  <div id="sidebar-head">
    <button id="btn-new-lesson" onclick="newLesson()">+ New lesson</button>
  </div>
  <div id="session-list"></div>
</aside>

<div id="main-col">

<div class="settings-bar">
  <div class="provider-toggle">
    <button id="btn-ollama" class="active" onclick="setProvider('ollama')">Ollama</button>
    <button id="btn-groq"   onclick="setProvider('groq')">Groq</button>
  </div>
  <label>Model</label>
  <input id="input-model" value="gemma4" />
  <span id="host-group">
    <label>Host</label>
    <input id="input-host" value="http://localhost:11434" />
  </span>
  <span id="key-group" class="hidden">
    <label>API Key</label>
    <input id="input-api-key" type="password" placeholder="gsk_..." />
  </span>
  <span>
    <label>Tavily Key</label>
    <input id="input-tavily-key" type="password" placeholder="tvly-..." style="width:220px;font-family:monospace;letter-spacing:0.03em" />
  </span>
</div>

<div id="chat-area"></div>

<!-- hidden file input -->
<input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif" class="hidden" onchange="handleFileChange()" />

<!-- Learn panel -->
<div id="learn-panel">
  <div id="topic-row">
    <div id="learn-attach-strip" class="attach-strip hidden"></div>
    <div class="input-row">
      <button class="icon-btn" title="Attach file (or paste an image)" onclick="openFilePicker('learn')">📎</button>
      <input id="input-topic" placeholder="Enter a topic to learn (e.g. photosynthesis)" onkeydown="if(event.key==='Enter') startLearn()" />
      <button class="send-btn" id="btn-start" onclick="startLearn()">Start</button>
      <button class="send-btn" id="btn-papers" onclick="startPapers()" style="background:#0891b2" title="Search past papers and generate questions">📄 Papers</button>
    </div>
  </div>
  <div id="answer-row" class="hidden">
    <div id="answer-attach-strip" class="attach-strip hidden"></div>
    <div class="input-row">
      <button class="icon-btn" title="Attach file (or paste an image)" onclick="openFilePicker('answer')">📎</button>
      <button class="icon-btn" title="Generate graph" onclick="requestGraph()">📊</button>
      <textarea id="input-answer" rows="1" placeholder="Type your answer or describe a graph..." onkeydown="answerKeydown(event)"></textarea>
      <button class="send-btn" id="btn-send" onclick="sendAnswer()">Send</button>
    </div>
  </div>
</div>

<!-- Check panel -->
<div id="check-panel" class="hidden">
  <div id="check-attach-strip" class="attach-strip hidden"></div>
  <div class="input-row" style="align-items:stretch">
    <button class="icon-btn" title="Attach file (or paste an image)" onclick="openFilePicker('check')" style="align-self:flex-end">📎</button>
    <div style="flex:1; display:flex; flex-direction:column; gap:8px">
      <textarea id="input-question" placeholder="Question"></textarea>
      <textarea id="input-check-answer" placeholder="Your answer"></textarea>
    </div>
    <button class="send-btn" onclick="submitCheck()" style="align-self:flex-end">Check</button>
  </div>
</div>

</div><!-- /main-col -->
</div><!-- /body-row -->

<script>
  let mode = 'learn';
  let messages = [];
  let busy = false;
  let attachment = null;
  let filePicker_target = '';
  let provider = 'ollama';
  let wrongStreak = 0;
  let paperTimer = null;
  // Ties every turn of one lesson together in the session log. Generated here
  // because the server keeps no session state — it is handed back each turn.
  let sessionId = crypto.randomUUID();
  // Kept because the topic input is cleared and hidden once a lesson starts,
  // but a mid-lesson "get me a past paper" still needs to know the subject.
  let currentTopic = '';
  // Which sidebar row is highlighted. Not the same as sessionId: a brand new
  // lesson has an id but no log rows yet, so there is nothing to highlight.
  let currentSessionOpen = null;

  // past-papers quiz state
  let paperMode = false;
  let paperQuestions = [];
  let paperIndex = 0;

  function setProvider(p) {
    provider = p;
    document.getElementById('btn-ollama').classList.toggle('active', p === 'ollama');
    document.getElementById('btn-groq').classList.toggle('active', p === 'groq');
    document.getElementById('host-group').classList.toggle('hidden', p !== 'ollama');
    document.getElementById('key-group').classList.toggle('hidden', p !== 'groq');
    /* llama-3.3-70b-versatile was decommissioned on 2026-08-17 and now 404s
       with model_not_found. Do not put a Llama model back here — the account
       has none. Note qwen/qwen3.6-27b is NOT a safe choice either: it reasons
       out loud, and only the vision path calls drop_reasoning(), so <think>
       blocks would reach the student and _SIGNAL_RE would stop finding
       verdicts. */
    document.getElementById('input-model').value =
      p === 'groq' ? 'openai/gpt-oss-120b' : 'gemma4';
  }

  /* ---- mode ---- */
  function setMode(m) {
    mode = m;
    document.getElementById('btn-learn').classList.toggle('active', m === 'learn');
    document.getElementById('btn-check').classList.toggle('active', m === 'check');
    document.getElementById('learn-panel').classList.toggle('hidden', m !== 'learn');
    document.getElementById('check-panel').classList.toggle('hidden', m !== 'check');
    clearChat();
    messages = [];
    wrongStreak = 0;
    paperMode = false; paperQuestions = []; paperIndex = 0;
    sessionId = crypto.randomUUID();   // a new lesson is a new session
    clearAttachment();
    resetLearnUI();
  }

  function clearChat() { document.getElementById('chat-area').innerHTML = ''; }

  function resetLearnUI() {
    document.getElementById('topic-row').classList.remove('hidden');
    document.getElementById('answer-row').classList.add('hidden');
    document.getElementById('input-topic').value = '';
    document.getElementById('input-answer').value = '';
    document.getElementById('btn-start').disabled  = false;
    document.getElementById('btn-papers').disabled = false;
  }

  function model()      { return document.getElementById('input-model').value.trim() || 'gemma4'; }
  function host()       { return document.getElementById('input-host').value.trim()  || 'http://localhost:11434'; }
  function apiKey()     { return document.getElementById('input-api-key').value.trim(); }
  function tavilyKey()  { return document.getElementById('input-tavily-key').value.trim(); }

  function basePayload() {
    return { provider, model: model(), host: host(), api_key: apiKey(),
             session_id: sessionId };
  }

  /* ---- attachment ---- */
  function openFilePicker(target) {
    filePicker_target = target;
    document.getElementById('file-input').value = '';
    document.getElementById('file-input').click();
  }

  async function handleFileChange() {
    const file = document.getElementById('file-input').files[0];
    if (!file) return;
    uploadFile(file, filePicker_target);
  }

  async function uploadFile(file, target) {
    const fd = new FormData();
    fd.append('file', file);

    const res  = await fetch('/api/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }

    attachment = data;
    if (data.type === 'image') attachment.previewUrl = URL.createObjectURL(file);

    renderAttachStrip(target);
  }

  /* ---- paste an image straight from the clipboard ---- */
  const PASTE_EXT = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/gif': 'gif' };

  // Whichever input the user can actually see is the one the paste belongs to.
  function activeAttachTarget() {
    if (mode === 'check') return 'check';
    return document.getElementById('answer-row').classList.contains('hidden') ? 'learn' : 'answer';
  }

  document.addEventListener('paste', (event) => {
    const items = Array.from(event.clipboardData?.items || []);
    const item  = items.find(i => i.kind === 'file' && i.type.startsWith('image/'));
    if (!item) return;                       // plain text paste — leave it alone
    const blob = item.getAsFile();
    if (!blob) return;

    event.preventDefault();                  // don't drop a blob URL into the textarea
    const ext  = PASTE_EXT[blob.type] || 'png';
    const name = `pasted-${Date.now()}.${ext}`;
    uploadFile(new File([blob], name, { type: blob.type }), activeAttachTarget());
  });

  function renderAttachStrip(target) {
    const stripId = target === 'check' ? 'check-attach-strip'
                  : target === 'answer' ? 'answer-attach-strip'
                  : 'learn-attach-strip';
    const strip = document.getElementById(stripId);
    strip.innerHTML = '';
    strip.classList.remove('hidden');

    if (attachment.type === 'image') {
      const img = document.createElement('img');
      img.src = attachment.previewUrl;
      strip.appendChild(img);
    } else {
      strip.insertAdjacentHTML('beforeend', `<span>📄</span>`);
    }

    const name = document.createElement('span');
    name.className = 'attach-name';
    name.textContent = attachment.name;
    strip.appendChild(name);

    const rm = document.createElement('button');
    rm.textContent = '✕';
    rm.onclick = () => clearAttachment();
    strip.appendChild(rm);
  }

  function clearAttachment() {
    attachment = null;
    ['learn-attach-strip','answer-attach-strip','check-attach-strip'].forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.innerHTML = ''; el.classList.add('hidden'); }
    });
  }

  /* ---- multiple-choice option helpers ---- */
  const OPTION_RE = /^([A-D])\)\s+(.+)$/gm;

  /* Options are optional now, so a single stray "A) ..." line is far more likely
     to be prose than a choice set. Two is the smallest real set (a yes/no pick),
     which is the same floor the past-papers parser uses. */
  function extractOptions(text) {
    const opts = [];
    let m;
    OPTION_RE.lastIndex = 0;
    while ((m = OPTION_RE.exec(text)) !== null) opts.push({ letter: m[1], text: m[2].trim() });
    return opts.length >= 2 ? opts : [];
  }

  function stripOptions(text) {
    return text.replace(/^[A-D]\)\s+.+$/gm, '').replace(/\n{3,}/g, '\n\n').trim();
  }

  function selectOption(text, optRow) {
    if (busy) return;
    optRow.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
    document.getElementById('input-answer').value = text;
    sendAnswer();
  }

  /* ---- bubbles ---- */
  function appendBubble(role, text, attach, onOptionSelect, verdict) {
    const area = document.getElementById('chat-area');
    const row  = document.createElement('div');
    row.className = `bubble-row ${role === 'tutor' ? 'tutor' : 'student'}`;

    const av = document.createElement('div');
    av.className = `avatar ${role === 'tutor' ? 'tutor-av' : 'student-av'}`;
    av.textContent = role === 'tutor' ? 'T' : 'S';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const options = role === 'tutor' ? extractOptions(text) : [];
    const displayText = options.length > 0 ? stripOptions(text) : text;
    bubble.innerHTML = marked.parse(displayText);

    // The backend has always returned `correct` and the front end has always
    // thrown it away, so a wrong answer came back as a worked solution with
    // nothing saying it was wrong. Seen live 2026-08-14 on 3x + 7 = 22.
    //
    // Strictly true/false. `correct` is null when the model sent no marker,
    // and null is not wrong — an == comparison would draw a cross on a reply
    // that never carried a verdict at all.
    if (verdict === true || verdict === false) {
      const cls = verdict ? 'verdict-correct' : 'verdict-wrong';
      bubble.classList.add(cls);
      bubble.insertAdjacentHTML('afterbegin',
        `<div class="verdict ${cls}">${verdict ? '✓ Correct' : '✗ Not correct'}</div>`);
    }

    if (attach) {
      if (attach.type === 'image') {
        const wrap = document.createElement('div');
        wrap.className = 'attach-preview';
        const img = document.createElement('img');
        img.src = attach.previewUrl;
        wrap.appendChild(img);
        bubble.appendChild(wrap);
      } else {
        bubble.insertAdjacentHTML('beforeend',
          `<div class="attach-pill">📄 ${attach.name}</div>`);
      }
    }

    if (role === 'tutor') { row.appendChild(av); row.appendChild(bubble); }
    else                  { row.appendChild(bubble); row.appendChild(av); }

    area.appendChild(row);
    renderMathInElement(bubble, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$',  right: '$',  display: false },
      ]
    });
    renderMermaidIn(bubble);
    renderGraphBlocksIn(bubble);

    if (options.length > 0) {
      const optRow = document.createElement('div');
      optRow.className = 'options-row';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = `${opt.letter}) ${opt.text}`;
        btn.onclick = onOptionSelect
          ? () => onOptionSelect(opt.letter, opt.text, optRow)
          : () => selectOption(`${opt.letter}) ${opt.text}`, optRow);
        optRow.appendChild(btn);
      });
      area.appendChild(optRow);
    }

    area.scrollTop = area.scrollHeight;
  }

  function appendThinking() {
    const area = document.getElementById('chat-area');
    const row  = document.createElement('div');
    row.className = 'bubble-row tutor';
    row.id = 'thinking-indicator';
    row.innerHTML = '<div class="avatar tutor-av">T</div>'
                  + '<div class="bubble thinking"><span></span><span></span><span></span></div>';
    area.appendChild(row);
    area.scrollTop = area.scrollHeight;
  }

  function removeThinking() {
    removeSearchStatus();
    const el = document.getElementById('thinking-indicator');
    if (el) el.remove();
  }

  /* ---- session history ---- */
  async function loadSessions() {
    try {
      const res  = await fetch('/api/sessions');
      const data = await res.json();
      renderSessions(data.sessions || []);
    } catch (e) {
      // The sidebar is a convenience. It must never cost the student a lesson.
    }
  }

  function renderSessions(sessions) {
    const list = document.getElementById('session-list');
    list.innerHTML = '';
    if (!sessions.length) {
      list.innerHTML = '<div class="session-empty">No past lessons yet.</div>';
      return;
    }
    sessions.forEach(s => {
      const el = document.createElement('div');
      el.className = 'session-item' + (s.session_id === currentSessionOpen ? ' active' : '');

      const title = document.createElement('div');
      title.className = 'session-title';
      // textContent, not innerHTML — a topic is student input and must not be
      // able to inject markup into the page.
      title.textContent = s.title || '(untitled)';

      const meta = document.createElement('div');
      meta.className = 'session-meta';
      meta.textContent = `${s.mode} · ${s.turns} turn${s.turns === 1 ? '' : 's'} · ${shortDate(s.updated)}`;

      el.appendChild(title);
      el.appendChild(meta);
      el.onclick = () => openSession(s.session_id);
      list.appendChild(el);
    });
  }

  function shortDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const sameDay = d.toDateString() === new Date().toDateString();
    return sameDay
      ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  async function openSession(id) {
    if (busy) return;
    try {
      const res = await fetch(`/api/sessions/${encodeURIComponent(id)}`);
      if (!res.ok) { appendBubble('tutor', 'That lesson could not be loaded.'); return; }
      const data = await res.json();

      if (mode !== 'learn') setMode('learn');   // regenerates sessionId — overwritten below
      clearChat();
      clearAttachment();
      wrongStreak = 0;
      paperMode = false; paperQuestions = []; paperIndex = 0;

      sessionId          = data.session_id;
      currentSessionOpen = data.session_id;
      currentTopic       = data.topic || '';
      messages           = data.messages;

      data.turns.forEach(t => {
        // A "start" turn's input is the topic, which never appeared as a bubble
        // the first time round — so it must not appear on replay either.
        if (t.event !== 'start') appendBubble('student', t.input);
        appendBubble('tutor', t.output);
      });

      // The topic row is hidden mid-lesson, so resuming has to open the answer row.
      document.getElementById('topic-row').classList.add('hidden');
      document.getElementById('answer-row').classList.toggle('hidden', !data.resumable);
      if (data.resumable) {
        document.getElementById('input-answer').focus();
      } else {
        appendHistoryBanner('Saved answer check — start a new lesson to keep going.');
      }
      loadSessions();               // repaint so the highlight moves
    } catch (e) {
      appendBubble('tutor', `Could not load that lesson: ${e.message}`);
    }
  }

  function appendHistoryBanner(text) {
    const area = document.getElementById('chat-area');
    const el   = document.createElement('div');
    el.className = 'history-banner';
    el.textContent = text;
    area.appendChild(el);
    area.scrollTop = area.scrollHeight;
  }

  function newLesson() {
    if (busy) return;
    currentSessionOpen = null;
    setMode('learn');               // already clears chat, messages and sessionId
    loadSessions();
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('hidden');
  }

  function appendDone() {
    const area   = document.getElementById('chat-area');
    const banner = document.createElement('div');
    banner.className = 'done-banner';
    banner.textContent = 'Session complete!';
    area.appendChild(banner);
    area.scrollTop = area.scrollHeight;
  }

  /* ---- learn: start ---- */
  async function startLearn() {
    const topic = document.getElementById('input-topic').value.trim();
    if (!topic || busy) return;
    currentTopic = topic;
    sessionId = crypto.randomUUID();   // each lesson is its own session
    currentSessionOpen = sessionId;
    busy = true;
    wrongStreak = 0;
    document.getElementById('btn-start').disabled = true;
    document.getElementById('topic-row').classList.add('hidden');

    const attach = attachment;
    clearAttachment();
    appendThinking();

    try {
      const res  = await fetch('/api/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic, ...basePayload(), attachment: attach }),
      });
      const data = await res.json();
      removeThinking();
      messages = data.messages;
      appendBubble('tutor', data.response);
      loadSessions();          // the lesson now has log rows — show it in the sidebar

      if (data.done) {
        appendDone();
      } else {
        document.getElementById('answer-row').classList.remove('hidden');
        document.getElementById('input-answer').focus();
      }
    } catch (e) {
      removeThinking();
      appendBubble('tutor', `Error: ${e.message}`);
      document.getElementById('topic-row').classList.remove('hidden');
      document.getElementById('btn-start').disabled = false;
    }
    busy = false;
  }

  /* ---- learn: reply ---- */
  async function sendAnswer() {
    const input = document.getElementById('input-answer').value.trim();
    if (!input || busy) return;
    busy = true;
    document.getElementById('btn-send').disabled = true;
    document.getElementById('input-answer').value = '';

    const attach = attachment;
    clearAttachment();
    appendBubble('student', input, attach);
    appendThinking();

    try {
      const res  = await fetch('/api/reply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages, input, ...basePayload(),
          attachment: attach,
          wrong_streak: wrongStreak,
          topic: currentTopic,
          tavily_key: tavilyKey(),
        }),
      });
      const data = await res.json();
      removeThinking();
      messages = data.messages;
      if (data.correct === true)  wrongStreak = 0;
      if (data.correct === false) wrongStreak += 1;
      appendBubble('tutor', data.response);
      loadSessions();          // turn count and timestamp just changed
      // Papers fetched mid-lesson: show the downloads, leave the lesson alone.
      if (data.papers && data.papers.length) showPapers(data.papers, null, 0);

      if (data.done) {
        appendDone();
        document.getElementById('answer-row').classList.add('hidden');
      }
    } catch (e) {
      removeThinking();
      appendBubble('tutor', `Error: ${e.message}`);
    }

    document.getElementById('btn-send').disabled = false;
    busy = false;
    if (!document.getElementById('answer-row').classList.contains('hidden')) {
      document.getElementById('input-answer').focus();
    }
  }

  function answerKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAnswer(); }
  }

  /* ---- check ---- */
  async function submitCheck() {
    const question = document.getElementById('input-question').value.trim();
    const answer   = document.getElementById('input-check-answer').value.trim();
    if (!question || !answer || busy) return;
    busy = true;

    const attach = attachment;
    clearAttachment();
    clearChat();
    appendBubble('student', `**Q:** ${question}\n\n**A:** ${answer}`, attach);
    appendThinking();

    try {
      const res  = await fetch('/api/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, answer, ...basePayload(), attachment: attach }),
      });
      const data = await res.json();
      removeThinking();
      appendBubble('tutor', data.response, null, null, data.correct);
    } catch (e) {
      removeThinking();
      appendBubble('tutor', `Error: ${e.message}`);
    }
    busy = false;
  }

  function renderMathInPage() { /* KaTeX onload hook — nothing needed at page load */ }

  /* ---- mermaid ---- */
  async function renderMermaidIn(bubble) {
    const mermaid = window.__mermaid;
    if (!mermaid) return;
    const blocks = bubble.querySelectorAll('pre code.language-mermaid');
    for (const block of blocks) {
      const code = block.textContent;
      const pre  = block.parentElement;
      try {
        const id  = 'mmd-' + Math.random().toString(36).slice(2);
        const { svg } = await mermaid.render(id, code);
        const wrap = document.createElement('div');
        wrap.className = 'mermaid-wrap';
        wrap.innerHTML = svg;
        pre.replaceWith(wrap);
      } catch (e) {
        // Fallback: show raw code in a styled block instead of erroring
        const fallback = document.createElement('pre');
        fallback.style.cssText = 'background:#f3f4f6;border-radius:8px;padding:10px;font-size:0.8rem;overflow-x:auto;margin-top:8px';
        fallback.textContent = code;
        pre.replaceWith(fallback);
      }
    }
  }

  /* ---- auto graph blocks (```graph in tutor response) ---- */
  function renderGraphBlocksIn(bubble) {
    const blocks = bubble.querySelectorAll('pre code.language-graph');
    for (const block of blocks) {
      const description = block.textContent.trim();
      const pre = block.parentElement;

      // Replace with a loading placeholder immediately
      const placeholder = document.createElement('div');
      placeholder.className = 'graph-img';
      placeholder.innerHTML = '<div style="padding:12px;color:#9ca3af;font-size:0.85rem">Generating graph...</div>';
      pre.replaceWith(placeholder);

      // Fire off the graph request
      fetch('/api/graph', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ description, ...basePayload() }),
      })
      .then(r => r.json())
      .then(data => {
        if (data.image) {
          const img = document.createElement('img');
          img.src = `data:image/png;base64,${data.image}`;
          img.style.cssText = 'width:100%;border-radius:8px;display:block';
          placeholder.innerHTML = '';
          placeholder.appendChild(img);
        } else {
          placeholder.innerHTML = `<div style="padding:8px;color:#ef4444;font-size:0.8rem">Graph error: ${data.error}</div>`;
        }
        document.getElementById('chat-area').scrollTop = document.getElementById('chat-area').scrollHeight;
      })
      .catch(e => {
        placeholder.innerHTML = `<div style="padding:8px;color:#ef4444;font-size:0.8rem">Graph error: ${e.message}</div>`;
      });
    }
  }

  /* ---- manual graph request ---- */
  async function requestGraph() {
    const description = document.getElementById('input-answer').value.trim();
    if (!description || busy) return;
    busy = true;
    document.getElementById('btn-send').disabled = true;
    document.getElementById('input-answer').value = '';

    appendBubble('student', `📊 Graph request: ${description}`);
    appendThinking();

    try {
      const res  = await fetch('/api/graph', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ description, ...basePayload() }),
      });
      const data = await res.json();
      removeThinking();

      if (data.error) {
        appendBubble('tutor', `Could not generate graph: ${data.error}`);
      } else {
        appendGraphBubble(data.image, description);
      }
    } catch (e) {
      removeThinking();
      appendBubble('tutor', `Error: ${e.message}`);

  function appendGraphBubble(imgB64, caption) {

  /* ── past papers ─────────────────────────────────────────────────────── */

  function parsePaperQuestions(raw) {
    const questions = [];
    const blocks = raw.split(/\n(?=Q\d+\.)/);
    for (const block of blocks) {
      if (!block.trim()) continue;
      const beforeOpts = block.split(/^A\)/m)[0];
      const qText = beforeOpts.replace(/^Q\d+\.\s*/, '').trim();
      if (!qText) continue;
      const opts = [...block.matchAll(/^([A-D])\)\s*(.+)$/gm)];
      if (opts.length < 2) continue;
      const ansMatch = block.match(/\[ANSWER:\s*([A-D])\]/i);
      if (!ansMatch) continue;
      questions.push({
        text: qText,
        options: opts.map(m => ({ letter: m[1], text: m[2].trim() })),
        answer: ansMatch[1].toUpperCase(),
      });
    }
    return questions;
  }
  // The papers request takes 20-100s — search, download, generate, verify — and
  // three dots for that long reads as hung. An elapsed clock shows it is alive.
  function showSearchStatus() {
    const area = document.getElementById('chat-area');
    const el = document.createElement('div');
    el.id = 'paper-search-status';
    el.className = 'paper-progress';
    area.appendChild(el);

    const started = Date.now();
    const tick = () => {
      const s = Math.round((Date.now() - started) / 1000);
      el.textContent = 'Searching past papers and downloading PDFs — '
                     + `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    };
    tick();
    paperTimer = setInterval(tick, 1000);
    area.scrollTop = area.scrollHeight;
  }

  function removeSearchStatus() {
    if (paperTimer) { clearInterval(paperTimer); paperTimer = null; }
    const el = document.getElementById('paper-search-status');
    if (el) el.remove();
  }


  function showPapers(papers, grounded, dropped) {
    const area = document.getElementById('chat-area');

    if (papers && papers.length) {
      const bar = document.createElement('div');
      bar.className = 'sources-bar';
      papers.forEach(p => {
        const unusable = p.scanned || p.no_questions;
        const a = document.createElement('a');
        a.className = 'paper-chip' + (unusable ? ' scanned' : '');
        a.href = p.download;
        a.setAttribute('download', '');
        a.textContent = (unusable ? '⚠ ' : '⬇ ') + (p.title || 'Past paper');
        a.title = p.scanned
          ? `${p.url}\n\nScanned paper — downloadable, but it has no text layer, so the questions below are not based on it.`
          : p.no_questions
          ? `${p.url}\n\nDownloadable, but no exam questions were found in it, so the questions below are not based on it.`
          : `${p.url}\n\nClick to download`;
        bar.appendChild(a);
      });
      area.appendChild(bar);
    }

    // Nothing was generated on a mid-lesson fetch, so there is no provenance to
    // describe — the chips speak for themselves.
    if (grounded === null) { area.scrollTop = area.scrollHeight; return; }

    // Be explicit about provenance: "past papers" must not imply these are the
    // real questions when they were generated from search snippets.
    const note = document.createElement('div');
    note.className = 'grounding-note';
    note.textContent = grounded
      ? 'Questions generated from the text of the papers above.'
      : 'No downloadable paper found — questions generated from search results, so they are practice questions rather than real exam questions.';
    if (dropped > 0) {
      note.textContent += ` ${dropped} more ${dropped === 1 ? 'was' : 'were'} discarded for having a wrong answer key.`;
    }
    area.appendChild(note);
    area.scrollTop = area.scrollHeight;
  }

  function showSources(sources) {
    if (!sources || !sources.length) return;
    const area = document.getElementById('chat-area');
    const bar  = document.createElement('div');
    bar.className = 'sources-bar';
    sources.forEach(s => {
      if (!s.url) return;
      const a = document.createElement('a');
      a.className = 'source-chip';
      a.href = s.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = '🔗 ' + (s.title || s.url);
      bar.appendChild(a);
    });
    area.appendChild(bar);
    area.scrollTop = area.scrollHeight;
  }

  function showPaperProgress() {
    const area = document.getElementById('chat-area');
    const p = document.createElement('div');
    p.className = 'paper-progress';
    p.textContent = `Question ${paperIndex + 1} of ${paperQuestions.length}`;
    area.appendChild(p);
    area.scrollTop = area.scrollHeight;
  }

  function showPaperQuestion() {
    if (paperIndex >= paperQuestions.length) {
      appendDone();
      paperMode = false;
      resetLearnUI();
      return;
    }
    showPaperProgress();
    const q = paperQuestions[paperIndex];
    const text = q.text + '\n\n' + q.options.map(o => `${o.letter}) ${o.text}`).join('\n');
    appendBubble('tutor', text, null, (letter, optText, optRow) =>
      selectPaperOption(letter, optText, optRow, q)
    );
  }

  async function selectPaperOption(letter, optText, optRow, q) {
    if (busy) return;
    busy = true;

    // Colour the chosen button, disable all
    optRow.querySelectorAll('.option-btn').forEach(btn => {
      btn.disabled = true;
      const btnLetter = btn.textContent.trim()[0];
      if (btnLetter === letter)   btn.classList.add(letter === q.answer ? 'correct' : 'wrong');
      if (btnLetter === q.answer && letter !== q.answer) btn.classList.add('correct');
    });

    appendBubble('student', `${letter}) ${optText}`);

    if (letter === q.answer) {
      wrongStreak = 0;
      paperIndex++;
      const msg = paperIndex < paperQuestions.length ? 'Correct! Here is the next one.' : 'Correct!';
      appendBubble('tutor', msg);
      busy = false;
      showPaperQuestion();
    } else {
      wrongStreak++;
      appendThinking();
      try {
        const res  = await fetch('/api/papers/hint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            question:     q.text,
            options:      q.options,
            chosen:       letter,
            correct:      q.answer,
            wrong_streak: wrongStreak,
            ...basePayload(),
          }),
        });
        let data;
        try { data = await res.json(); }
        catch { data = { error: `Server error (HTTP ${res.status})` }; }
        removeThinking();
        appendBubble('tutor', data.response || data.error);
      } catch (e) {
        removeThinking();
        appendBubble('tutor', `Error: ${e.message}`);
      }

      if (wrongStreak >= 3) {
        // Move on after 3 wrong answers
        paperIndex++;
        busy = false;
        showPaperQuestion();
      } else {
        // Re-show the same question with fresh buttons
        busy = false;
        const text = q.text + '\n\n' + q.options.map(o => `${o.letter}) ${o.text}`).join('\n');
        appendBubble('tutor', text, null, (l, t, row) => selectPaperOption(l, t, row, q));
      }
    }
  }

  async function startPapers() {
    const topic     = document.getElementById('input-topic').value.trim();
    const tvlyKey   = tavilyKey();
    if (busy) return;
    if (!topic) {
      appendBubble('tutor', 'Type a topic in the box first, then press Papers.');
      return;
    }
    currentTopic = topic;
    // No key check here — the server falls back to TAVILY_KEY in .env, and only
    // it knows whether that fallback exists. It returns a clear error if not.

    busy = true;
    paperMode = true;
    wrongStreak = 0;
    paperQuestions = [];
    paperIndex = 0;

    document.getElementById('btn-papers').disabled = true;
    document.getElementById('btn-start').disabled  = true;
    document.getElementById('topic-row').classList.add('hidden');
    clearChat();

    appendThinking();
    showSearchStatus();
    try {
      const res  = await fetch('/api/papers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          topic,
          tavily_key:  tvlyKey,
          n_questions: 5,
          ...basePayload(),
        }),
      });
      let data;
      try { data = await res.json(); }
      catch { data = { error: `Server error (HTTP ${res.status}) — check the Flask console` }; }
      removeThinking();

      if (data.error) {
        appendBubble('tutor', `Could not fetch papers: ${data.error}`);
        document.getElementById('topic-row').classList.remove('hidden');
        document.getElementById('btn-start').disabled  = false;
        document.getElementById('btn-papers').disabled = false;
        busy = false;
        paperMode = false;
        return;
      }

      showPapers(data.papers, data.grounded, data.dropped);
      showSources(data.sources);
      paperQuestions = parsePaperQuestions(data.questions);

      if (!paperQuestions.length) {
        appendBubble('tutor', 'Could not parse questions from the search results. Try a different topic.');
        document.getElementById('topic-row').classList.remove('hidden');
        document.getElementById('btn-start').disabled  = false;
        document.getElementById('btn-papers').disabled = false;
        busy = false;
        paperMode = false;
        return;
      }

      busy = false;
      showPaperQuestion();

    } catch (e) {
      removeThinking();
      appendBubble('tutor', `Error: ${e.message}`);
      document.getElementById('topic-row').classList.remove('hidden');
      document.getElementById('btn-start').disabled  = false;
      document.getElementById('btn-papers').disabled = false;
      busy = false;
      paperMode = false;
    }
  }

  // ── auth ───────────────────────────────────────────────────────────────────

  let authMode = 'login';   // or 'register'

  function showAuthGate() {
    document.getElementById('auth-gate').classList.remove('hidden');
  }

  function toggleAuthMode() {
    authMode = authMode === 'login' ? 'register' : 'login';
    const registering = authMode === 'register';
    document.getElementById('auth-title').textContent  = registering ? 'Create an account' : 'Log in';
    document.getElementById('auth-submit').textContent = registering ? 'Create account' : 'Log in';
    document.getElementById('auth-switch-text').textContent = registering ? 'Already have an account?' : 'No account yet?';
    document.getElementById('auth-switch-link').textContent = registering ? 'Log in' : 'Create one';
    document.getElementById('auth-password').autocomplete   = registering ? 'new-password' : 'current-password';
    document.getElementById('auth-error').classList.add('hidden');
  }

  function authError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  async function submitAuth(event) {
    event.preventDefault();          // stop the browser navigating away
    const btn = document.getElementById('auth-submit');
    btn.disabled = true;
    document.getElementById('auth-error').classList.add('hidden');
    try {
      const res = await fetch(`/api/${authMode}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('auth-username').value,
          password: document.getElementById('auth-password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) { authError(data.error || 'Could not sign you in.'); return; }
      document.getElementById('auth-password').value = '';
      enterApp(data.user);
    } catch (e) {
      authError(e.message);
    } finally {
      btn.disabled = false;
    }
  }

  function enterApp(user) {
    document.getElementById('whoami').textContent = user.username;
    document.getElementById('auth-gate').classList.add('hidden');
    loadSessions();       // the sidebar is per-user, so it can only load now
  }

  async function logout() {
    await fetch('/api/logout', { method: 'POST' });
    // Drop the in-page lesson too, or the next person at this machine reads it.
    messages = [];
    clearChat();
    document.getElementById('session-list').innerHTML = '';
    document.getElementById('whoami').textContent = '';
    showAuthGate();
  }

  // Any request can come back 401 once the 30-day session expires. Catching it
  // in one place beats checking the status at all ten call sites.
  const _fetch = window.fetch.bind(window);
  window.fetch = async (...args) => {
    const res = await _fetch(...args);
    if (res.status === 401) showAuthGate();
    return res;
  };

  // Decide login screen or app before painting anything. loadSessions() is
  // called from enterApp, not here — it would 401 while logged out.
  fetch('/api/me')
    .then(r => r.json())
    .then(d => { if (d.user) enterApp(d.user); })
    .catch(() => {});
</script>
