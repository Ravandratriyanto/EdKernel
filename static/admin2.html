<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdKernel Admin</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body class="bg-[#121218] text-[#e8e8ec]" style="font-family:Inter,sans-serif">
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    // Small inline-SVG icon helper (Feather style).
    const Icon = ({ d, size = 16 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        {d}
      </svg>
    );
    const IconSearch = <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>;
    const IconPlus   = <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>;
    const IconUsers  = <><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></>;
    const IconKey    = <><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3"/></>;

    function Sidebar({ curricula, selected, onSelect}){
      const [q, setQ] = useState('');
      return (
        <aside className="w-64 shrink-0 bg-[#20212b] border-r border-[#30313e] flex flex-col h-screen">
          <div className="p-4 border-b border-[#30313e]">
            <h1 className="text-sm font-bold text-[#6c63ff] tracking-wide">EdKernel Admin</h1>
          </div>

          <div className="p-3">
            <div className="flex items-center gap-2 mb-2">
              <span className="text-xs text-[#8d8d9c] uppercase tracking-wide">Curricula</span>
              <button className="ml-auto text-xs text-[#6c63ff] hover:text-[#837cff]">
                <Icon d={IconPlus} />
              </button>
            </div>
            <div className="relative">
              <span className="absolute left-2 top-1/2 -translate-y-1/2 text-[#8d8d9c]">
                <Icon d={IconSearch} size={14} />
              </span>
              <input
                value={q}
                onChange={(e) => setQ(e.target.value)}
                placeholder="Search…"
                className="w-full bg-[#121218] border border-[#30313e] rounded-md pl-7 pr-2 py-1.5 text-sm text-[#e8e8ec] placeholder-[#8d8d9c] focus:outline-none focus:border-[#6c63ff]"
              />
            </div>
          </div>

          <div className="flex-1 overflow-y-auto p-3">
            {curricula
              .filter(c => (c.name || '').toLowerCase().includes(q.toLowerCase()))
              .map(c => (
                <button key={c.id} onClick={() => onSelect(c)}
                  className={"w-full text-left text-sm rounded-md px-3 py-2 mb-1 " +
                    (selected && selected.id === c.id
                      ? "bg-[#6c63ff] text-white"
                      : "text-[#e8e8ec] hover:bg-[#30313e]")}>
                  {c.name}
                </button>
              ))}
          </div>

          <div className="p-3 border-t border-[#30313e]">
            <div className="text-xs text-[#8d8d9c] uppercase tracking-wide mb-2">Settings</div>
            <button className="w-full flex items-center gap-2 text-sm text-[#e8e8ec] hover:bg-[#30313e] rounded-md px-2 py-1.5">
              <Icon d={IconUsers} /> Manage Users
            </button>
            <button className="w-full flex items-center gap-2 text-sm text-[#e8e8ec] hover:bg-[#30313e] rounded-md px-2 py-1.5">
              <Icon d={IconKey} /> API Keys
            </button>
          </div>
        </aside>
      );
    }

    function App() {
      const [curricula, setCurricula] = useState([]);
      const [selected, setSelected] = useState(null);

      useEffect(() => {
        fetch('/api/admin/curricula')
          .then(r => r.json())
          .then(list => setCurricula(Array.isArray(list) ? list : []))
          .catch(() => setCurricula([]));
      }, []);

      return (
        <div className="flex">
          <Sidebar curricula={curricula} selected={selected} onSelect={setSelected} />
          <main className="flex-1 p-8">
            {selected
              ? <div className="text-xl font-semibold">{selected.name} <span className="ml-2 text-xs font-mono bg-[#30313e] text-[#8d8d9c] px-2 py-0.5 rounded">{selected.id}</span></div>
              : <div className="text-[#8d8d9c]">Select a curriculum.</div>}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
